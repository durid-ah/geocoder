# Nominatim runtime tuning — https://nominatim.org/release-docs/develop/admin/Installation/#tuning-the-postgresql-database
# Adjust memory settings to match container/host RAM.

shared_buffers = 2GB
maintenance_work_mem = 10GB
autovacuum_work_mem = 2GB
work_mem = 50MB
effective_cache_size = 24GB
synchronous_commit = off
max_wal_size = 2GB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
random_page_cost = 1.1
